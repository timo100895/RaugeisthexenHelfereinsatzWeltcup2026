name: Supabase wachhalten

# Kostenlose Supabase-Projekte pausieren sich nach 7 Tagen ohne Aktivitaet
# automatisch. Dieser Job schickt taeglich eine harmlose, minimale Leseanfrage
# an die Datenbank, damit das Projekt fuer die Ornemer Raugeisthexen auch in
# ruhigeren Phasen (z.B. weit vor der naechsten Veranstaltung) erreichbar
# bleibt. Nutzt denselben oeffentlichen Schluessel wie die App selbst -
# keine zusaetzlichen Rechte, keine zusaetzlichen Kosten.
on:
  schedule:
    - cron: '17 4 * * *' # taeglich um 04:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl -sf "${VITE_SUPABASE_URL}/rest/v1/app_settings?select=id&limit=1" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -o /dev/null
          echo "Supabase-Projekt erfolgreich angepingt."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
